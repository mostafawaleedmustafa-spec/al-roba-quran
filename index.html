<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الربع - تتبع ختمة القرآن</title>
<style>
body{font-family:system-ui; background:#0f172a; color:white; text-align:center; padding:20px}
h1{color:#22c55e; font-size:32px}
.card{background:#1e293b; padding:20px; border-radius:16px; margin:15px 0}
button{background:#22c55e; color:black; border:none; padding:12px 20px; border-radius:10px; font-size:18px; font-weight:bold; width:100%; margin-top:10px}
.rub{padding:10px; border-bottom:1px solid #334155; display:flex; justify-content:space-between}
.done{text-decoration:line-through; color:#64748b}
</style>
</head>
<body>
<h1>📖 الربع</h1>
<p>تتبع ختمة القرآن ربع بربع</p>
<div class="card">
<div class="rub"><span>الربع 1 - الفاتحة</span><input type="checkbox"></div>
<div class="rub"><span>الربع 2 - البقرة 1</span><input type="checkbox"></div>
<div class="rub"><span>الربع 3 - البقرة 2</span><input type="checkbox"></div>
<div class="rub"><span>الربع 4 - البقرة 3</span><input type="checkbox"></div>
</div>
<button onclick="alert('تم حفظ تقدمك - جزاك الله خيرا')">حفظ تقدمي</button>
<p style="margin-top:20px; color:#94a3b8">الموقع ده من عمل مصطفى وليد</p>
</body>
</html>
